<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ink { fill: #1f1f1f; } .inks { stroke: #1f1f1f; }
    .wire { stroke: #8c8c8c; } .wireb { stroke: #b3b3b3; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f2f2f2; } .inks { stroke: #f2f2f2; }
      .wire { stroke: #cfcfcf; } .wireb { stroke: #8f8f8f; }
    }
  </style>
  <defs>
    <radialGradient id="g" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f3ecef"/>
      <stop offset="1" stop-color="#cbbcc4"/>
    </radialGradient>
  </defs>
  <!-- sphere fills the icon so it stays big at 16px -->
  <circle cx="30" cy="34" r="27" fill="url(#g)" class="wire" stroke-width="2"/>
  <path d="M3 34 A27 8 0 0 1 57 34" fill="none" class="wireb" stroke-width="1.4" stroke-dasharray="2.5 2"/>
  <path d="M3 34 A27 8 0 0 0 57 34" fill="none" class="wire" stroke-width="1.8"/>
  <ellipse cx="30" cy="34" rx="9.5" ry="27" fill="none" class="wireb" stroke-width="1.3"/>
  <line x1="30" y1="61" x2="30" y2="11" stroke="#3d3d3d" stroke-width="2.4"/>
  <line x1="30" y1="34" x2="45" y2="18" stroke="#d62728" stroke-width="4" stroke-linecap="round"/>
  <path d="M49.5 13 L40 16.6 L46 22.2 Z" fill="#d62728"/>
  <circle cx="30" cy="34" r="2.3" class="ink"/>
  <!-- ket |psi> at the arrow tip -->
  <text x="63" y="12" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" fill="#d62728">|ψ⟩</text>
</svg>
